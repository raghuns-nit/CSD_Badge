<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Secure Team ID Issuer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f4f9; margin: 0; padding: 6px; height: 100vh; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; overflow: hidden; }
        .card { background: white; width: 100%; max-width: 550px; padding: 10px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); box-sizing: border-box; margin-bottom: 6px; display: flex; flex-direction: column; }
        h3 { margin: 0 0 4px 0; font-size: 14px; color: #333; }
        input, select, button { width: 100%; padding: 7px; margin: 3px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 12px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:active { background: #0056b3; }
        
        #dashboard { display: none; height: 100%; width: 100%; max-width: 550px; flex-direction: column; gap: 6px; }
        .scrollable-inventory { overflow-y: auto; max-height: 110px; border: 1px solid #eee; font-size: 11px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 4px; text-align: left; }
        th { background-color: #f8f9fa; position: sticky; top: 0; }
        
        #cameraSection { display: none; text-align: center; background: #000; padding: 4px; border-radius: 4px; }
        #cameraStream { width: 100%; max-height: 120px; border-radius: 4px; object-fit: cover; }

        .badge-preview { display: none; text-align: center; border: 1px solid #ddd; padding: 8px; border-radius: 6px; margin-top: 4px; }
        .nav-link { color: #007bff; text-decoration: none; font-size: 11px; text-align: center; display: block; margin-top: 2px; }
    </style>
</head>
<body>

<div class="card" id="setupScreen" style="margin-top: 20px;">
    <h3>Admin Setup & GitHub Sync</h3>
    <input type="password" id="adminPass" placeholder="Admin Password">
    <hr style="width:100%; border:0; border-top:1px solid #eee; margin:6px 0;">
    <p style="font-size: 11px; color: #666; margin:0 0 3px 0;">GitHub Private Repo Settings:</p>
    <input type="text" id="ghOwner" placeholder="GitHub Username">
    <input type="text" id="ghRepo" placeholder="Private Repo Name" value="Badge_Details">
    <input type="password" id="ghToken" placeholder="GitHub Personal Access Token (PAT)">
    <p style="font-size: 11px; color: #666; margin:4px 0 2px 0;">Select Private Key JSON File:</p>
    <input type="file" id="privateKeyFile" accept=".json" onchange="loadPrivateKey(event)">
    <button onclick="loginAndFetch()">Login & Sync Inventory</button>
    <a href="index.html" class="nav-link">← Back to Verifier</a>
</div>

<div id="dashboard">
    <div class="card" style="max-height: 150px;">
        <h3 id="inventoryTitle">📋 Live Inventory Syncing...</h3>
        <div class="scrollable-inventory">
            <table id="inventoryTable">
                <thead><tr><th>Name</th><th>Role</th><th>Expiry</th><th>Status</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="card" style="flex: 1; overflow-y: auto;">
        <h3>➕ Issue or Edit Badge</h3>
        <select id="csvSelect" onchange="fillFromCSV()">
            <option value="">-- Select Existing Member to Edit or Create New --</option>
        </select>
        
        <div style="display: flex; gap: 4px;">
            <input type="text" id="name" placeholder="Full Name" required>
            <select id="role">
                <option value="Staff">Staff</option>
                <option value="Intern">Intern</option>
                <option value="Volunteer">Volunteer</option>
                <option value="Admin">Admin</option>
            </select>
        </div>
        <div style="display: flex; gap: 4px;">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="phone" placeholder="Phone (10 digits)" pattern="[6-9][0-9]{9}" required>
        </div>
        
        <div style="display: flex; gap: 4px; align-items: center;">
            <input type="hidden" id="photoData" value="">
            <button type="button" onclick="startCamera()" style="background: #6c757d; padding: 6px;">📸 Live Snapshot</button>
            <input type="file" accept="image/*" onchange="handleImageFile(event)" style="padding: 2px;">
        </div>

        <div id="cameraSection">
            <video id="cameraStream" autoplay playsinline></video>
            <button type="button" onclick="takeSnapshot()" style="background: #28a745; padding: 4px;">Snap & Save Photo</button>
        </div>
        
        <div style="display: flex; align-items: center; gap: 4px;">
            <span style="font-size: 11px; font-weight: bold; color: #555;">Valid Until:</span>
            <input type="date" id="expiryDate" required>
        </div>
        
        <button onclick="generateAndSaveID()" id="issueBtn" style="background: #2b6cb0; padding: 9px;">Generate, Save & Auto-Sync</button>
        <a href="index.html" class="nav-link" onclick="logout()">← Logout / Back to Verifier</a>

        <div class="badge-preview" id="badgeContainer">
            <h3 style="margin-bottom: 2px;" id="bName"></h3>
            <p style="font-size:11px; color: #666; margin: 0 0 4px 0;" id="bRole"></p>
            <img id="bPhoto" src="" style="width:50px; height:50px; border-radius:50%; object-fit:cover; display:none; margin: 0 auto 4px; border: 2px solid #ccc;">
            <div id="qrcode" style="display:flex; justify-content:center;"></div>
            <p style="font-size:10px; color:green; margin:2px 0;">✅ Synced to Private GitHub Repo (`Badge_Details`)</p>
            <button onclick="downloadBadgePDF()" style="background: #28a745; padding: 6px; margin-top: 4px;">📥 Download Badge PDF</button>
        </div>
    </div>
</div>

<script>
    const ALLOWED_PASSWORD_HASHES = ["240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"]; 
    
    let loadedPrivateKeyJWK = null;
    let githubData = { sha: "", content: "Name,Role,Email,Phone,ValidityDate,PhotoURL\n" };
    let mediaStream = null;
    let currentSignedJwt = "";

    window.onload = () => {
        document.getElementById('ghOwner').value = localStorage.getItem('ghOwner') || '';
        document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || 'Badge_Details';
        document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
        
        const dateInput = document.getElementById('expiryDate');
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);
        
        const defaultExpiry = new Date();
        defaultExpiry.setFullYear(defaultExpiry.getFullYear() + 1);
        dateInput.value = defaultExpiry.toISOString().split('T')[0];
    };

    function loadPrivateKey(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                loadedPrivateKeyJWK = await window.crypto.subtle.importKey(
                    "jwk", JSON.parse(e.target.result), { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, true, ["sign"]
                );
                alert("Private Key Loaded & Ready!");
            } catch (err) { alert("Invalid Private Key File."); }
        };
        reader.readAsText(file);
    }

    async function loginAndFetch() {
        const pass = document.getElementById('adminPass').value.trim();
        const msgBuffer = new TextEncoder().encode(pass);
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
        const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

        if (!ALLOWED_PASSWORD_HASHES.includes(hashHex) || !loadedPrivateKeyJWK) {
            alert("Incorrect password or missing Private Key.");
            return;
        }

        localStorage.setItem('ghOwner', document.getElementById('ghOwner').value.trim());
        localStorage.setItem('ghRepo', document.getElementById('ghRepo').value.trim());
        localStorage.setItem('ghToken', document.getElementById('ghToken').value.trim());

        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        
        await fetchInventory();
    }

    async function fetchInventory() {
        const owner = localStorage.getItem('ghOwner');
        const repo = localStorage.getItem('ghRepo');
        const token = localStorage.getItem('ghToken');
        
        try {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/members.csv`, {
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });

            if (res.status === 404) {
                document.getElementById('inventoryTitle').innerText = "📋 Inventory (New File)";
                renderInventory();
                return;
            }

            if (!res.ok) throw new Error("GitHub API Error");

            const data = await res.json();
            githubData.sha = data.sha;
            githubData.content = decodeURIComponent(escape(atob(data.content)));
            document.getElementById('inventoryTitle').innerText = "📋 Live Inventory";
            renderInventory();
            populateDropdown();
        } catch (e) {
            alert("Failed to fetch inventory from GitHub. Check credentials.");
        }
    }

    function renderInventory() {
        const tbody = document.querySelector('#inventoryTable tbody');
        tbody.innerHTML = '';
        const lines = githubData.content.split('\n');
        let count = 0;
        
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            count++;
            const cols = lines[i].split(',');
            if(cols.length < 5) continue;
            const isExpired = Date.now() > new Date(cols[4]).getTime();
            const status = isExpired ? '<span style="color:red">Expired</span>' : '<span style="color:green">Active</span>';
            tbody.innerHTML += `<tr><td>${cols[0]}</td><td>${cols[1]}</td><td>${cols[4]}</td><td>${status}</td></tr>`;
        }
        if(count === 0) tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No badges found.</td></tr>`;
    }

    function populateDropdown() {
        const select = document.getElementById('csvSelect');
        select.innerHTML = '<option value="">-- Select Existing Member to Edit or Create New --</option>';
        const lines = githubData.content.split('\n');
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const cols = lines[i].split(',');
            if(cols.length < 5) continue;
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `${cols[0]} (${cols[1]}) - Edit`;
            select.appendChild(opt);
        }
    }

    function fillFromCSV() {
        const idx = document.getElementById('csvSelect').value;
        if (idx === "") return;
        const lines = githubData.content.split('\n');
        const cols = lines[idx].split(',');
        document.getElementById('name').value = cols[0] || '';
        document.getElementById('role').value = cols[1] || 'Staff';
        document.getElementById('email').value = cols[2] || '';
        document.getElementById('phone').value = cols[3] || '';
        document.getElementById('expiryDate').value = cols[4] || '';
        const photoVal = cols.slice(5).join(',').trim();
        document.getElementById('photoData').value = photoVal.replace(/^"|"$/g, '') || '';
    }

    async function startCamera() {
        document.getElementById('cameraSection').style.display = 'block';
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('cameraStream').srcObject = mediaStream;
        } catch (err) { alert("Camera access denied."); }
    }

    function takeSnapshot() {
        const video = document.getElementById('cameraStream');
        const canvas = document.createElement('canvas');
        canvas.width = 120; canvas.height = 120;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        
        document.getElementById('photoData').value = dataUrl;
        if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        document.getElementById('cameraSection').style.display = 'none';
        alert("Photo captured!");
    }

    function handleImageFile(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 120; canvas.height = 120;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                document.getElementById('photoData').value = canvas.toDataURL('image/jpeg', 0.7);
                alert("Image converted!");
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function generateAndSaveID() {
        const name = document.getElementById('name').value.trim();
        const role = document.getElementById('role').value;
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const photoBase64 = document.getElementById('photoData').value.trim();
        const expiryStr = document.getElementById('expiryDate').value;
        const editIndex = document.getElementById('csvSelect').value;

        if(!name || !email || !phone || !expiryStr) { alert("Please fill required fields."); return; }
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert("Invalid email format."); return; }
        if(!/^[6-9]\d{9}$/.test(phone)) { alert("Enter a valid 10-digit Indian phone number."); return; }

        const btn = document.getElementById('issueBtn');
        btn.disabled = true; btn.innerText = "Syncing with GitHub...";

        const expTimestamp = new Date(expiryStr + "T23:59:59").getTime();
        const headerB64 = btoa(JSON.stringify({ alg: "RS256", typ: "JWT" }));
        const payloadB64 = btoa(JSON.stringify({ name, role, email, phone, photo: photoBase64, exp: expTimestamp }));
        const unsignedToken = `${headerB64}.${payloadB64}`;

        try {
            const signatureBuffer = await window.crypto.subtle.sign("RSASSA-PKCS1-v1_5", loadedPrivateKeyJWK, new TextEncoder().encode(unsignedToken));
            const signatureB64 = btoa(String.fromCharCode(...new Uint8Array(signatureBuffer))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            currentSignedJwt = `${unsignedToken}.${signatureB64}`;

            const cleanPhoto = `"${photoBase64}"`;
            const newRow = `${name},${role},${email},${phone},${expiryStr},${cleanPhoto}`;
            
            let lines = githubData.content.split('\n');
            if (editIndex !== "") {
                // UPDATE EXISTING RECORD (EDIT)
                lines[editIndex] = newRow;
                githubData.content = lines.join('\n');
            } else {
                // APPEND NEW RECORD
                githubData.content = githubData.content.replace(/\n$/, "") + "\n" + newRow;
            }

            const owner = localStorage.getItem('ghOwner');
            const repo = localStorage.getItem('ghRepo');
            const token = localStorage.getItem('ghToken');
            
            const payload = {
                message: editIndex !== "" ? `Updated badge for ${name}` : `Issued badge for ${name}`,
                content: btoa(unescape(encodeURIComponent(githubData.content)))
            };
            if (githubData.sha) payload.sha = githubData.sha;

            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/members.csv`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if(!res.ok) throw new Error("GitHub Sync Failed");
            const data = await res.json();
            if(data.content) githubData.sha = data.content.sha;

            renderInventory();
            populateDropdown();

            document.getElementById('bName').innerText = name;
            document.getElementById('bRole').innerText = `${role.toUpperCase()} (Exp: ${expiryStr})`;
            const photoImg = document.getElementById('bPhoto');
            if(photoBase64) { photoImg.src = photoBase64; photoImg.style.display = 'block'; } else { photoImg.style.display = 'none'; }

            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: currentSignedJwt, width: 110, height: 110 });
            document.getElementById('badgeContainer').style.display = "block";

            alert("Badge successfully saved and synced to GitHub!");
        } catch (err) {
            alert("Error: " + err.message);
        } finally {
            btn.disabled = false; btn.innerText = "Generate, Save & Auto-Sync";
        }
    }

    function downloadBadgePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: [85, 110] });

        const name = document.getElementById('name').value;
        const role = document.getElementById('role').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const expiryStr = document.getElementById('expiryDate').value;
        const photoDataUrl = document.getElementById('photoData').value;

        let headerColor = [0, 64, 128];
        if (role === "Intern") headerColor = [230, 126, 34];
        if (role === "Volunteer") headerColor = [39, 174, 96];
        if (role === "Admin") headerColor = [142, 68, 173];

        doc.setFillColor(headerColor[0], headerColor[1], headerColor[2]);
        doc.rect(0, 0, 85, 18, "F");

        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.text(`${role.toUpperCase()} ID`, 42.5, 11, { align: "center" });

        if (photoDataUrl && photoDataUrl.startsWith('data:image')) {
            try { doc.addImage(photoDataUrl, 'JPEG', 32.5, 21, 20, 20); } catch (e) {}
        }

        doc.setTextColor(44, 62, 80);
        doc.setFontSize(14);
        doc.text(name, 42.5, 46, { align: "center" });

        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(100, 100, 100);
        doc.text(email, 42.5, 52, { align: "center" });
        doc.text(phone, 42.5, 57, { align: "center" });

        const qrCanvas = document.querySelector('#qrcode canvas');
        if (qrCanvas) {
            doc.addImage(qrCanvas.toDataURL("image/png"), 'PNG', 24.5, 62, 36, 36);
        }

        doc.setFontSize(8);
        doc.setTextColor(150, 150, 150);
        doc.text(`Expires: ${expiryStr}`, 42.5, 103, { align: "center" });

        doc.save(`${name.replace(/\s+/g, '_')}_Badge.pdf`);
    }

    function logout() { loadedPrivateKeyJWK = null; githubData = { sha: "", content: "" }; }
</script>

</body>
</html>
