<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Secure Team ID Issuer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f4f9; margin: 0; padding: 5px; height: 100vh; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; overflow: hidden; }
        .card { background: white; width: 100%; max-width: 520px; padding: 10px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); box-sizing: border-box; margin-bottom: 5px; display: flex; flex-direction: column; }
        h3 { margin: 0 0 3px 0; font-size: 13px; color: #333; }
        input, select, button { width: 100%; padding: 6px; margin: 2px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 11px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:active { background: #0056b3; }
        
        #dashboard { display: none; height: 100%; width: 100%; max-width: 520px; flex-direction: column; gap: 5px; }
        .scrollable-inventory { overflow-y: auto; max-height: 110px; border: 1px solid #eee; font-size: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 3px; text-align: left; }
        th { background-color: #f8f9fa; position: sticky; top: 0; }
        
        #cameraSection { display: none; text-align: center; background: #000; padding: 4px; border-radius: 6px; }
        .camera-wrapper { width: 100%; height: 160px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #cameraStream { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }

        .badge-preview { display: none; text-align: center; border: 1px solid #ddd; padding: 6px; border-radius: 6px; margin-top: 3px; background: #fff; }
        .nav-link { color: #007bff; text-decoration: none; font-size: 10px; text-align: center; display: block; margin-top: 2px; }
    </style>
</head>
<body>

<div class="card" id="setupScreen" style="margin-top: 15px;">
    <h3>Admin Setup & GitHub Sync</h3>
    <input type="password" id="adminPass" placeholder="Admin Password">
    <hr style="width:100%; border:0; border-top:1px solid #eee; margin:5px 0;">
    <p style="font-size: 10px; color: #666; margin:0 0 2px 0;">GitHub Private Repo Settings:</p>
    <input type="text" id="ghOwner" placeholder="GitHub Username">
    <input type="text" id="ghRepo" placeholder="Private Repo Name" value="Badge_Details">
    <input type="password" id="ghToken" placeholder="GitHub Personal Access Token (PAT)">
    <p style="font-size: 10px; color: #666; margin:3px 0 2px 0;">Select ECDSA Private Key JSON File:</p>
    <input type="file" id="privateKeyFile" accept=".json" onchange="loadPrivateKey(event)">
    <button onclick="loginAndFetch()">Login & Sync Inventory</button>
    <a href="index.html" class="nav-link">← Back to Verifier</a>
</div>

<div id="dashboard">
    <div class="card" style="max-height: 140px;">
        <h3 id="inventoryTitle">📋 Live Inventory (View or Download)</h3>
        <div class="scrollable-inventory">
            <table id="inventoryTable">
                <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="card" style="flex: 1; overflow-y: auto;">
        <h3>➕ Issue or Edit Badge</h3>
        <select id="csvSelect" onchange="fillFromCSV()"><option value="">-- Select Existing Member to Edit or Create New --</option></select>
        
        <div style="display: flex; gap: 4px;">
            <input type="text" id="name" placeholder="Full Name" required>
            <select id="role"><option value="Staff">Staff</option><option value="Intern">Intern</option><option value="Volunteer">Volunteer</option><option value="Admin">Admin</option></select>
        </div>
        <div style="display: flex; gap: 4px;">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="phone" placeholder="Phone (10 digits)" pattern="[6-9][0-9]{9}" required>
        </div>
        
        <div style="display: flex; gap: 4px; align-items: center;">
            <input type="hidden" id="photoData" value="">
            <button type="button" onclick="startCamera()" style="background: #6c757d; padding: 5px;">📸 Live Snapshot</button>
            <input type="file" accept="image/*" onchange="handleImageFile(event)" style="padding: 1px;">
        </div>

        <div id="cameraSection">
            <div class="camera-wrapper"><video id="cameraStream" autoplay playsinline></video></div>
            <button type="button" onclick="takeSnapshot()" style="background: #28a745; padding: 5px; margin-top: 3px;">Snap & Save Photo</button>
        </div>
        
        <div style="display: flex; align-items: center; gap: 4px;">
            <span style="font-size: 10px; font-weight: bold; color: #555;">Valid Until:</span><input type="date" id="expiryDate" required>
        </div>
        
        <button onclick="generateAndSaveID()" id="issueBtn" style="background: #2b6cb0; padding: 8px;">Generate, Save & Auto-Sync</button>
        <a href="index.html" class="nav-link" onclick="logout()">← Logout / Back to Verifier</a>

        <div class="badge-preview" id="badgeContainer">
            <h3 style="margin-bottom: 2px;" id="bName"></h3>
            <p style="font-size: 10px; color: #666; margin: 0 0 3px 0;" id="bRole"></p>
            <img id="bPhoto" src="" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover; display: none; margin: 0 auto 3px; border: 2px solid #ccc;">
            <div id="qrcode" style="display: flex; justify-content: center;"></div>
            <p style="font-size: 9px; color: green; margin: 2px 0;">✅ Ready</p>
            <button onclick="downloadBadgePDF()" style="background: #28a745; padding: 6px; margin-top: 3px;">📥 Download Badge PDF</button>
        </div>
    </div>
</div>

<script>
    const ALLOWED_PASSWORD_HASHES = ["240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"]; 
    
    let rawPrivateKeyJson = null;
    let githubData = { sha: "", content: "Name,Role,Email,Phone,ValidityDate,PhotoURL\n" };
    let mediaStream = null;
    let currentSignedJwt = "";

    window.onload = () => {
        document.getElementById('ghOwner').value = localStorage.getItem('ghOwner') || '';
        document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || 'Badge_Details';
        document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
        const defaultExpiry = new Date(); defaultExpiry.setFullYear(defaultExpiry.getFullYear() + 1);
        document.getElementById('expiryDate').value = defaultExpiry.toISOString().split('T')[0];
    };

    function loadPrivateKey(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => { rawPrivateKeyJson = e.target.result; alert("ECDSA Private Key Loaded!"); };
        reader.readAsText(file);
    }

    async function getSigningKey() {
        if (!rawPrivateKeyJson) throw new Error("Private key file not loaded.");
        return await window.crypto.subtle.importKey(
            "jwk", JSON.parse(rawPrivateKeyJson), { name: "ECDSA", namedCurve: "P-256" }, true, ["sign"]
        );
    }

    async function loginAndFetch() {
        const pass = document.getElementById('adminPass').value.trim();
        const hashBuffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pass));
        const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

        if (!ALLOWED_PASSWORD_HASHES.includes(hashHex) || !rawPrivateKeyJson) { alert("Incorrect password or missing ECDSA Key."); return; }

        localStorage.setItem('ghOwner', document.getElementById('ghOwner').value.trim());
        localStorage.setItem('ghRepo', document.getElementById('ghRepo').value.trim());
        localStorage.setItem('ghToken', document.getElementById('ghToken').value.trim());

        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        await fetchInventory();
    }

    async function fetchInventory() {
        try {
            const res = await fetch(`https://api.github.com/repos/${localStorage.getItem('ghOwner')}/${localStorage.getItem('ghRepo')}/contents/members.csv`, {
                headers: { 'Authorization': `token ${localStorage.getItem('ghToken')}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (res.status === 404) { renderInventory(); return; }
            const data = await res.json(); githubData.sha = data.sha; githubData.content = decodeURIComponent(escape(atob(data.content)));
            renderInventory(); populateDropdown();
        } catch (e) { alert("Failed to fetch inventory."); }
    }

    function renderInventory() {
        const tbody = document.querySelector('#inventoryTable tbody'); tbody.innerHTML = '';
        const lines = githubData.content.split('\n'); let count = 0;
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const cols = parseCSVLine(lines[i]); if(cols.length < 5) continue; count++;
            const status = Date.now() > new Date(cols[4]).getTime() ? '<span style="color:red">Expired</span>' : '<span style="color:green">Active</span>';
            tbody.innerHTML += `<tr><td>${cols[0]}</td><td>${cols[1]}</td><td>${status}</td>
                <td><button onclick="viewRowBadge(${i})" style="padding:2px; background:#3182ce; font-size:9px;">👁️</button>
                <button onclick="downloadRowPDF(${i})" style="padding:2px; background:#28a745; font-size:9px;">📥</button></td></tr>`;
        }
    }

    function populateDropdown() {
        const select = document.getElementById('csvSelect'); select.innerHTML = '<option value="">-- Edit/Create --</option>';
        const lines = githubData.content.split('\n');
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const cols = parseCSVLine(lines[i]); if(cols.length < 5) continue;
            const opt = document.createElement('option'); opt.value = i; opt.innerText = `${cols[0]}`; select.appendChild(opt);
        }
    }

    function parseCSVLine(text) {
        if (!text) return []; let result = []; let cur = ''; let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            if (text[i] === '"') inQuotes = !inQuotes;
            else if (text[i] === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
            else cur += text[i];
        }
        result.push(cur.trim()); return result;
    }

    function fillFromCSV() {
        const idx = document.getElementById('csvSelect').value; if (idx === "") return;
        const cols = parseCSVLine(githubData.content.split('\n')[idx]);
        document.getElementById('name').value = cols[0] || ''; document.getElementById('role').value = cols[1] || 'Staff';
        document.getElementById('email').value = cols[2] || ''; document.getElementById('phone').value = cols[3] || '';
        document.getElementById('expiryDate').value = cols[4] || ''; document.getElementById('photoData').value = (cols[5] || '').replace(/^"|"$/g, '');
    }

    async function startCamera() {
        document.getElementById('cameraSection').style.display = 'block';
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('cameraStream').srcObject = mediaStream;
    }

    function takeSnapshot() {
        const canvas = document.createElement('canvas'); canvas.width = 150; canvas.height = 150;
        canvas.getContext('2d').drawImage(document.getElementById('cameraStream'), 0, 0, 150, 150);
        document.getElementById('photoData').value = canvas.toDataURL('image/jpeg', 0.7);
        if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        document.getElementById('cameraSection').style.display = 'none';
    }

    function handleImageFile(event) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image(); img.onload = () => {
                const canvas = document.createElement('canvas'); canvas.width = 150; canvas.height = 150;
                canvas.getContext('2d').drawImage(img, 0, 0, 150, 150);
                document.getElementById('photoData').value = canvas.toDataURL('image/jpeg', 0.7);
            }; img.src = e.target.result;
        }; reader.readAsDataURL(event.target.files[0]);
    }

    async function generateAndSaveID() {
        const name = document.getElementById('name').value.trim(); const role = document.getElementById('role').value;
        const email = document.getElementById('email').value.trim(); const phone = document.getElementById('phone').value.trim();
        const photoBase64 = document.getElementById('photoData').value.trim(); const expiryStr = document.getElementById('expiryDate').value;
        const editIndex = document.getElementById('csvSelect').value;

        if(!name || !email || !phone || !expiryStr) return;
        document.getElementById('issueBtn').disabled = true;

        try {
            const privateKey = await getSigningKey();
            const expTimestamp = new Date(expiryStr + "T23:59:59").getTime();
            const headerB64 = btoa(JSON.stringify({ alg: "ES256", typ: "JWT" }));
            
            // MINIFIED PAYLOAD FOR TINY QR CODES
            const payloadB64 = btoa(JSON.stringify({ n: name, r: role, e: email, p: phone, x: expTimestamp }));
            const unsignedToken = `${headerB64}.${payloadB64}`;

            // ECDSA SIGNATURE
            const signatureBuffer = await window.crypto.subtle.sign({ name: "ECDSA", hash: { name: "SHA-256" } }, privateKey, new TextEncoder().encode(unsignedToken));
            const signatureB64 = btoa(String.fromCharCode(...new Uint8Array(signatureBuffer))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            currentSignedJwt = `${unsignedToken}.${signatureB64}`;

            let lines = githubData.content.split('\n');
            const newRow = `${name},${role},${email},${phone},${expiryStr},"${photoBase64}"`;
            if (editIndex !== "") { lines[editIndex] = newRow; githubData.content = lines.join('\n'); } 
            else { githubData.content = githubData.content.replace(/\n$/, "") + "\n" + newRow; }

            const res = await fetch(`https://api.github.com/repos/${localStorage.getItem('ghOwner')}/${localStorage.getItem('ghRepo')}/contents/members.csv`, {
                method: 'PUT', headers: { 'Authorization': `token ${localStorage.getItem('ghToken')}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Update ${name}`, content: btoa(unescape(encodeURIComponent(githubData.content))), sha: githubData.sha || undefined })
            });

            if(!res.ok) throw new Error(); const data = await res.json(); if(data.content) githubData.sha = data.content.sha;

            renderInventory(); populateDropdown();
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: currentSignedJwt, width: 120, height: 120, correctLevel: QRCode.CorrectLevel.L });
            document.getElementById('badgeContainer').style.display = "block";
            alert("Saved and Synced!");
        } catch (err) { alert("Error generating/syncing."); } finally { document.getElementById('issueBtn').disabled = false; }
    }

    async function viewRowBadge(lineIdx) {
        const cols = parseCSVLine(githubData.content.split('\n')[lineIdx]);
        document.getElementById('name').value = cols[0]; document.getElementById('role').value = cols[1];
        document.getElementById('email').value = cols[2]; document.getElementById('phone').value = cols[3];
        document.getElementById('expiryDate').value = cols[4]; document.getElementById('photoData').value = (cols[5] || '').replace(/^"|"$/g, '');
        
        const privateKey = await getSigningKey();
        const payloadB64 = btoa(JSON.stringify({ n: cols[0], r: cols[1], e: cols[2], p: cols[3], x: new Date(cols[4] + "T23:59:59").getTime() }));
        const unsignedToken = `${btoa(JSON.stringify({ alg: "ES256", typ: "JWT" }))}.${payloadB64}`;
        const signatureBuffer = await window.crypto.subtle.sign({ name: "ECDSA", hash: { name: "SHA-256" } }, privateKey, new TextEncoder().encode(unsignedToken));
        currentSignedJwt = `${unsignedToken}.${btoa(String.fromCharCode(...new Uint8Array(signatureBuffer))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`;
        
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: currentSignedJwt, width: 120, height: 120, correctLevel: QRCode.CorrectLevel.L });
        document.getElementById('badgeContainer').style.display = "block";
    }

    async function downloadRowPDF(lineIdx) { await viewRowBadge(lineIdx); downloadBadgePDF(); }

    function downloadBadgePDF() {
        const tempDiv = document.createElement('div'); document.body.appendChild(tempDiv);
        new QRCode(tempDiv, { text: currentSignedJwt, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.L });
        const { jsPDF } = window.jspdf; const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: [85, 110] });

        doc.setFillColor(0, 64, 128); doc.rect(0, 0, 85, 18, "F");
        doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text(`${document.getElementById('role').value.toUpperCase()} ID`, 42.5, 11, { align: "center" });
        
        const photo = document.getElementById('photoData').value;
        if (photo) { try { doc.addImage(photo, 'JPEG', 32.5, 21, 20, 20); } catch (e) {} }

        doc.setTextColor(44, 62, 80); doc.setFontSize(14); doc.text(document.getElementById('name').value, 42.5, 46, { align: "center" });
        doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(100, 100, 100); doc.text(document.getElementById('email').value, 42.5, 52, { align: "center" }); doc.text(document.getElementById('phone').value, 42.5, 57, { align: "center" });
        doc.addImage(tempDiv.querySelector('canvas').toDataURL("image/png"), 'PNG', 24.5, 62, 36, 36);
        doc.setFontSize(8); doc.setTextColor(150, 150, 150); doc.text(`Expires: ${document.getElementById('expiryDate').value}`, 42.5, 103, { align: "center" });

        doc.save(`${document.getElementById('name').value.replace(/\s+/g, '_')}_Badge.pdf`); document.body.removeChild(tempDiv);
    }
    function logout() { rawPrivateKeyJson = null; githubData = { sha: "", content: "" }; }
</script>
</body>
</html>
