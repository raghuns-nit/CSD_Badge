<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Secure Team ID Issuer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f4f9; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; overflow: hidden; }
        .card { background: white; width: 100%; max-width: 600px; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); box-sizing: border-box; margin-bottom: 10px; display: flex; flex-direction: column; }
        h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        input, select, button { width: 100%; padding: 10px; margin: 4px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 8px; }
        button:active { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        /* Dashboard Layout */
        #dashboard { display: none; height: 100%; width: 100%; max-width: 600px; flex-direction: column; gap: 10px; }
        .scrollable-inventory { overflow-y: auto; max-height: 200px; border: 1px solid #eee; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 6px; text-align: left; }
        th { background-color: #f8f9fa; position: sticky; top: 0; }
        
        .badge-preview { display: none; text-align: center; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-top: 10px; }
        .nav-link { color: #007bff; text-decoration: none; font-size: 13px; text-align: center; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card" id="setupScreen">
    <h3>Admin Setup & GitHub Sync</h3>
    <input type="password" id="adminPass" placeholder="Admin Password (e.g., admin123)">
    <hr style="width:100%; border:0; border-top:1px solid #eee; margin:10px 0;">
    <p style="font-size: 12px; color: #666; margin:0 0 5px 0;">GitHub Private Repo Settings (Saves locally):</p>
    <input type="text" id="ghOwner" placeholder="GitHub Username (e.g., yourname)">
    <input type="text" id="ghRepo" placeholder="Private Repo Name (e.g., team-data)">
    <input type="password" id="ghToken" placeholder="GitHub Personal Access Token (PAT)">
    <p style="font-size: 12px; color: #666; margin:10px 0 5px 0;">Select Private Key JSON File:</p>
    <input type="file" id="privateKeyFile" accept=".json" onchange="loadPrivateKey(event)">
    <button onclick="loginAndFetch()" id="loginBtn">Login & Sync Inventory</button>
    <a href="index.html" class="nav-link">← Back to Verifier</a>
</div>

<div id="dashboard">
    <div class="card" style="flex: 1; max-height: 250px;">
        <h3 id="inventoryTitle">📋 Live Inventory Syncing...</h3>
        <div class="scrollable-inventory">
            <table id="inventoryTable">
                <thead><tr><th>Name</th><th>Role</th><th>Expiry</th><th>Status</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="card" style="flex: 2; overflow-y: auto;">
        <h3>➕ Issue New ID Badge</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="name" placeholder="Full Name" required>
            <select id="role">
                <option value="Staff">Staff</option>
                <option value="Intern">Intern</option>
                <option value="Volunteer">Volunteer</option>
                <option value="Admin">Admin</option>
            </select>
        </div>
        <div style="display: flex; gap: 10px;">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="phone" placeholder="Phone Number (10 digits)" pattern="[6-9][0-9]{9}" required>
        </div>
        
        <input type="text" id="photoUrl" placeholder="Photo URL (Optional)">
        
        <p style="font-size: 12px; margin: 5px 0 0 0;">Expiry Date:</p>
        <input type="date" id="expiryDate" required>
        
        <button onclick="generateAndSaveID()" id="issueBtn">Generate & Auto-Sync to GitHub</button>
        <a href="index.html" class="nav-link" onclick="logout()">← Logout / Back to Verifier</a>

        <div class="badge-preview" id="badgeContainer">
            <h3 style="margin-bottom: 5px;" id="bName"></h3>
            <p style="font-size:12px; color: #666; margin: 0 0 10px 0;" id="bRole"></p>
            <img id="bPhoto" src="" style="width:70px; height:70px; border-radius:50%; object-fit:cover; display:none; margin: 0 auto 10px;">
            <div id="qrcode" style="display:flex; justify-content:center;"></div>
            <p style="font-size:11px; color:green; margin-top:10px;">✅ Saved directly to GitHub Database</p>
        </div>
    </div>
</div>

<script>
    // --- 1. CONFIGURATION ---
    // PASTE YOUR GENERATED HASH HERE:
    const ALLOWED_PASSWORD_HASHES = ["240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"]; 
    
    let loadedPrivateKeyJWK = null;
    let githubData = { sha: "", content: "Name,Role,Email,Phone,ValidityDate,PhotoURL\n" }; // Default empty CSV state

    // Initialize logic
    window.onload = () => {
        // Pre-fill local storage settings
        document.getElementById('ghOwner').value = localStorage.getItem('ghOwner') || '';
        document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || '';
        document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
        
        // Restrict Date Picker to Today onwards
        const dateInput = document.getElementById('expiryDate');
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);
        
        // Default Expiry: Set to exactly 1 year ahead
        const defaultExpiry = new Date();
        defaultExpiry.setFullYear(defaultExpiry.getFullYear() + 1);
        dateInput.value = defaultExpiry.toISOString().split('T')[0];
    };

    // Load Private Key
    function loadPrivateKey(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                loadedPrivateKeyJWK = await window.crypto.subtle.importKey(
                    "jwk", JSON.parse(e.target.result), { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, true, ["sign"]
                );
                alert("Private Key Validated & Ready!");
            } catch (err) { alert("Invalid Private Key File."); }
        };
        reader.readAsText(file);
    }

    // --- 2. AUTH & GITHUB API LOGIC ---
    async function loginAndFetch() {
        const pass = document.getElementById('adminPass').value.trim();
        const msgBuffer = new TextEncoder().encode(pass);
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
        const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

        if (!ALLOWED_PASSWORD_HASHES.includes(hashHex) || !loadedPrivateKeyJWK) {
            alert("Incorrect password or missing Private Key.");
            return;
        }

        // Save GitHub Settings to localStorage
        localStorage.setItem('ghOwner', document.getElementById('ghOwner').value.trim());
        localStorage.setItem('ghRepo', document.getElementById('ghRepo').value.trim());
        localStorage.setItem('ghToken', document.getElementById('ghToken').value.trim());

        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        
        await fetchInventory();
    }

    async function fetchInventory() {
        const owner = localStorage.getItem('ghOwner');
        const repo = localStorage.getItem('ghRepo');
        const token = localStorage.getItem('ghToken');
        
        try {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/members.csv`, {
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });

            if (res.status === 404) {
                document.getElementById('inventoryTitle').innerText = "📋 Inventory (New File)";
                renderInventory();
                return;
            }

            if (!res.ok) throw new Error("GitHub API Error");

            const data = await res.json();
            githubData.sha = data.sha;
            
            // Safely Decode Base64 from GitHub
            githubData.content = decodeURIComponent(escape(atob(data.content)));
            document.getElementById('inventoryTitle').innerText = "📋 Live Inventory";
            renderInventory();
        } catch (e) {
            alert("Failed to fetch inventory from GitHub. Check your Repo Name and Token.");
            document.getElementById('inventoryTitle').innerText = "📋 Inventory (Offline Mode)";
        }
    }

    function renderInventory() {
        const tbody = document.querySelector('#inventoryTable tbody');
        tbody.innerHTML = '';
        const lines = githubData.content.split('\n');
        let count = 0;
        
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            count++;
            const cols = lines[i].split(',');
            const expiryDate = new Date(cols[4]);
            const isExpired = Date.now() > expiryDate.getTime();
            const status = isExpired ? '<span style="color:red">Expired</span>' : '<span style="color:green">Active</span>';
            
            tbody.innerHTML += `<tr><td>${cols[0]}</td><td>${cols[1]}</td><td>${cols[4]}</td><td>${status}</td></tr>`;
        }

        if(count === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No badges issued yet.</td></tr>`;
        }
    }

    // --- 3. BADGE GENERATION & AUTO-SYNC ---
    async function generateAndSaveID() {
        const btn = document.getElementById('issueBtn');
        const name = document.getElementById('name').value.trim();
        const role = document.getElementById('role').value;
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const photoUrl = document.getElementById('photoUrl').value.trim();
        const expiryStr = document.getElementById('expiryDate').value;

        // Basic Check
        if(!name || !email || !phone || !expiryStr) {
            alert("Name, Email, Phone, and Expiry are required.");
            return;
        }

        // Email Validation (Basic RFC 5322 standard check)
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alert("Please enter a valid email address format.");
            return;
        }

        // Phone Validation (10 Digit India Style starting with 6,7,8, or 9)
        const phoneRegex = /^[6-9]\d{9}$/;
        if (!phoneRegex.test(phone)) {
            alert("Please enter a valid 10-digit Indian phone number.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Processing & Syncing...";

        const expTimestamp = new Date(expiryStr + "T23:59:59").getTime();

        // 1. Cryptographically Sign Token
        const headerB64 = btoa(JSON.stringify({ alg: "RS256", typ: "JWT" }));
        const payloadB64 = btoa(JSON.stringify({ name, role, email, phone, photo: photoUrl, exp: expTimestamp }));
        const unsignedToken = `${headerB64}.${payloadB64}`;

        try {
            const signatureBuffer = await window.crypto.subtle.sign("RSASSA-PKCS1-v1_5", loadedPrivateKeyJWK, new TextEncoder().encode(unsignedToken));
            const signatureB64 = btoa(String.fromCharCode(...new Uint8Array(signatureBuffer))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            const signedJwt = `${unsignedToken}.${signatureB64}`;

            // 2. Append Data locally
            const newRow = `\n${name},${role},${email},${phone},${expiryStr},${photoUrl}`;
            // Remove trailing newlines before appending
            githubData.content = githubData.content.replace(/\n$/, "") + newRow;

            // 3. Push to GitHub Automatically
            const owner = localStorage.getItem('ghOwner');
            const repo = localStorage.getItem('ghRepo');
            const token = localStorage.getItem('ghToken');
            
            // Safe Base64 encode for GitHub push
            const contentEncoded = btoa(unescape(encodeURIComponent(githubData.content)));

            const payload = {
                message: `Issued new ID for ${name}`,
                content: contentEncoded
            };
            if (githubData.sha) payload.sha = githubData.sha; // Must include SHA to update existing file

            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/members.csv`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if(!res.ok) throw new Error("GitHub Sync Failed");

            const data = await res.json();
            if(data.content) githubData.sha = data.content.sha; // Update local SHA for the next badge creation

            // 4. Update UI
            renderInventory();
            document.getElementById('bName').innerText = name;
            document.getElementById('bRole').innerText = `${role.toUpperCase()} (Exp: ${expiryStr})`;
            
            const photoImg = document.getElementById('bPhoto');
            if(photoUrl) { photoImg.src = photoUrl; photoImg.style.display = 'block'; } 
            else { photoImg.style.display = 'none'; }

            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: signedJwt, width: 140, height: 140 });
            document.getElementById('badgeContainer').style.display = "block";
            
            // Clear form inputs
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('photoUrl').value = '';

        } catch (err) { 
            alert("Error generating or syncing badge: " + err.message); 
        } finally {
            btn.disabled = false;
            btn.innerText = "Generate & Auto-Sync to GitHub";
        }
    }

    function logout() {
        loadedPrivateKeyJWK = null;
        githubData = { sha: "", content: "" };
    }
</script>

</body>
</html>
